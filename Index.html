<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Canceled Social Media</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }
        .container {
            width: 50%;
            margin: auto;
            overflow: hidden;
        }
        h1 {
            text-align: center;
            margin: 20px 0;
        }
        .post-form {
            margin-bottom: 20px;
        }
        textarea {
            width: 100%;
            height: 100px;
            padding: 10px;
            margin-bottom: 10px;
            border-radius: 5px;
            border: 1px solid #ddd;
            resize: none;
        }
        button {
            display: block;
            width: 100%;
            padding: 10px;
            background-color: #333;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }
        button:hover {
            background-color: #555;
        }
        .posts {
            background-color: #fff;
            padding: 10px;
            border-radius: 5px;
            border: 1px solid #ddd;
        }
        .post {
            margin-bottom: 10px;
            padding: 10px;
            background-color: #e9e9e9;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome to Canceled Social Media</h1>
        <div class="post-form">
            <textarea id="postContent" placeholder="What's on your mind?"></textarea>
            <button onclick="submitPost()">Post</button>
        </div>
        <div id="posts" class="posts">
            <!-- User posts will appear here -->
        </div>
    </div>
    <script>
        function submitPost() {
            const postContent = document.getElementById('postContent').value;
            if (postContent.trim() !== '') {
                const postsDiv = document.getElementById('posts');
                const newPost = document.createElement('div');
                newPost.className = 'post';
                newPost.innerText = postContent;
                postsDiv.insertBefore(newPost, postsDiv.firstChild);
                document.getElementById('postContent').value = '';
            }
        }
    </script>
</body>
</html>
